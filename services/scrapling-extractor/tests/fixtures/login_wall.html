<!doctype html>
<html>
  <head><title>Vendor Sign In</title></head>
  <body>
    <main>
      <h1>Sign in</h1>
      <form action="/login" method="post">
        <p>Please log in to see the bid description and attachments. You must create an account and sign in before you can access these materials. Registered suppliers can review documents, ask questions and submit their proposals from this page.</p>
        <label>Email</label><input type="email" name="email">
        <label>Password</label><input type="password" name="password">
        <button type="submit">Sign in</button>
      </form>
    </main>
  </body>
</html>
